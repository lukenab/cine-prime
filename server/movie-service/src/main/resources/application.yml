server:
  port: 8081

spring:
  application:
    name: movie-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/movie_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # This database was hand-migrated (docs/database/movie-service/V3..V34,
    # applied by hand via docker exec psql) before Flyway existed, so it
    # already has the full V1 baseline schema+seed but no flyway_schema_history
    # row. baseline-on-migrate makes Flyway insert a "V1 already applied"
    # marker instead of re-running CREATE TABLE statements that already exist.
    # A genuinely empty/fresh database has no schema for baseline-on-migrate to
    # detect, so Flyway just runs every migration from V1 normally in that case.
    baseline-on-migrate: true
    # Two parallel feature branches each independently picked V18 before merging;
    # renumbering the collision (see V22__add_cinema_cluster_cover_image.sql) left
    # some already-migrated dev databases with a higher version (22) applied before
    # lower ones (18-21) that were never run. out-of-order lets Flyway backfill
    # those lower versions instead of refusing to start.
    out-of-order: true
    baseline-version: 1
    baseline-description: "Pre-Flyway schema (docs/database/movie-service/V3-V34, applied by hand)"
    # V33__backfill_default_cluster_demand_profile.sql was removed after it already ran on
    # existing databases (its one-time backfill is now superseded by
    # CinemaClusterService#approveCluster auto-creating the same default, plus the admin-facing
    # CinemaClusterDemandProfileController). Without this, Flyway's validate step fails on
    # startup with "Detected applied migration not resolved locally: 33" for any DB that already
    # has that row in flyway_schema_history. This tells Flyway to tolerate a resolved-but-missing
    # migration instead of requiring a manual `flyway repair` against every such database.
    ignore-migration-patterns: "*:missing"

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always
  health:
    flyway:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  signerKey: 873bcf3b6023c6cfac735831cc01cbd59c6f64c2341050f12e5f0224d7edea62

tmdb:
  api-key: 4cf6e7ff7b2095ae0d09da1cae2f1606
  image:
    # Max "still" candidates surfaced/importable per movie beyond the single recommended
    # backdrop (TMDB has no dedicated "stills" endpoint for movies - these are additional
    # backdrops). Posters and backdrops are always capped at 1 recommended each per import.
    max-stills: ${TMDB_IMAGE_MAX_STILLS:10}

movie:
  readiness:
    # MOV-03 release gate: require >=1 future non-cancelled showtime before COMING_SOON -> NOW_SHOWING.
    require-showtime-for-release: ${MOVIE_REQUIRE_SHOWTIME_FOR_RELEASE:false}

auto-showtime:
  # Immediate dispatch is the normal path; this poller recovers ACCEPTED runs
  # after a restart or interrupted delivery.
  scheduler:
    fixed-delay-ms: ${AUTO_SHOWTIME_SCHEDULER_FIXED_DELAY_MS:60000}
  worker:
    core-pool-size: ${AUTO_SHOWTIME_WORKER_CORE_POOL_SIZE:2}
    max-pool-size: ${AUTO_SHOWTIME_WORKER_MAX_POOL_SIZE:4}
    queue-capacity: ${AUTO_SHOWTIME_WORKER_QUEUE_CAPACITY:50}
  # Keep false in production. SUPER_ADMIN remains authorized regardless.
  manual-execution:
    enabled: ${AUTO_SHOWTIME_MANUAL_EXECUTION_ENABLED:false}

