server:
  port: 8081

spring:
  application:
    name: movie-service

  datasource:
    #    url: jdbc:postgresql://postgres:5432/movie_db
    url: jdbc:postgresql://localhost:5433/movie_db
    username: postgres
    password: "123456"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}