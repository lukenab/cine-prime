server:
  port: 8088

spring:
  application:
    name: auth-service
  config:
    # Support repository-level .env files for local IDE/Maven runs.
    # Real environment variables still take precedence in deployed environments.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  data:
      redis:
        host: ${SPRING_REDIS_HOST:localhost}
        port: ${SPRING_REDIS_PORT:6379}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev: update | prod: validate (dùng Flyway/Liquibase)
    defer-datasource-initialization: true   # chạy data.sql SAU khi Hibernate tạo tables
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # =====  KAFKA PRODUCER =====
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": true
        "[spring.json.type.mapping]": "userRegistered:authservice.event.UserRegisteredEvent,otpRequested:authservice.event.OtpRequestedEvent,accountActivation:authservice.event.AccountActivationRequestedEvent,accountStatusChanged:authservice.event.AccountStatusChangedEvent,passwordResetRequested:authservice.event.PasswordResetRequestedEvent"

eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  signerKey: ${JWT_SIGNER_KEY:873bcf3b6023c6cfac735831cc01cbd59c6f64c2341050f12e5f0224d7edea62}
  valid-duration: ${JWT_VALID_DURATION:1800}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:36000}

app:
  internal-service-key: ${INTERNAL_SERVICE_KEY:local-dev-internal-key-change-before-deploy}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    email: ${ADMIN_EMAIL:admin@cineprime.vn}
  branch-manager:
    username: ${BRANCH_MANAGER_USERNAME:branchmanager}
    password: ${BRANCH_MANAGER_PASSWORD:BranchManager@123}
    email: ${BRANCH_MANAGER_EMAIL:branch.manager@cineprime.vn}
  seed:
    sync-account-passwords: ${SEED_ACCOUNT_PASSWORDS:true}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

auth:
  otp:
    ttl-minutes: 5
    cooldown-seconds: 60
  default-role: MEMBER
  activation:
    ttl-hours: 24
  password-reset:
    ttl-minutes: 30
