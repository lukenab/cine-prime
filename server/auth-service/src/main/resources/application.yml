server:
  port: 8088

spring:
  application:
    name: auth-service
  
  datasource:
#    url: jdbc:postgresql://postgres:5432/auth_db
    url: jdbc:postgresql://localhost:5433/auth_db
    username: postgres
    password: "123456"
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

