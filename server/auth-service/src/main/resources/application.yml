server:
  port: 8088

spring:
  application:
    name: auth-service

  mail:
    host: smtp.gmail.com
    port: 587
    username: cineprime.theater.contact@gmail.com
    password: yczsrtyvtveosbvi
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
      redis:
        host: localhost
        port: 6379

  datasource:
    #    url: jdbc:postgresql://postgres:5432/auth_db
    url: jdbc:postgresql://localhost:5433/auth_db
    username: postgres
    password: "123456"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # =====  KAFKA PRODUCER =====
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": true
        "[spring.json.type.mapping]": "userRegistered:authservice.event.UserRegisteredEvent,userUpdated:authservice.event.UserUpdatedEvent"

eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

