server:
  port: 8087

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    # No real credential default here on purpose - the previous hardcoded Gmail
    # app password was committed to the repo and is the prime suspect for why
    # OTP/activation emails silently stopped sending (Gmail auto-revokes leaked
    # app passwords). Set MAIL_USERNAME/MAIL_PASSWORD in .env (see .env.example)
    # with a freshly generated Gmail App Password. See Issue #268.
    username: ${MAIL_USERNAME:CHANGE_ME_SET_IN_ENV}
    password: ${MAIL_PASSWORD:CHANGE_ME_SET_IN_ENV}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        "[spring.json.trusted.packages]": "notificationservice.event"
        "[spring.json.type.mapping]": "otpRequested:notificationservice.event.OtpRequestedEvent,accountActivation:notificationservice.event.AccountActivationRequestedEvent,passwordResetRequested:notificationservice.event.PasswordResetRequestedEvent"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
jwt:
  signerKey: ${JWT_SIGNER_KEY:873bcf3b6023c6cfac735831cc01cbd59c6f64c2341050f12e5f0224d7edea62}