<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/></head>
<body style="margin:0;padding:0;background:#050505;">
<div style="font-family:Arial,sans-serif;background:#050505;padding:40px 20px;text-align:center;max-width:600px;margin:0 auto;">
    <h1 style="color:#fff;font-size:28px;letter-spacing:2px;">CINE<span style="color:#3b82f6;">PRIME</span></h1>
    <div style="background:#141414;border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:30px 22px;margin:28px auto;max-width:440px;text-align:left;">
        <h2 style="color:#fff;font-size:20px;margin-top:0;">Reset your password</h2>
        <p style="color:rgba(255,255,255,.68);font-size:14px;line-height:1.6;">We received a request to reset your CinePrime password.</p>
        <div style="text-align:center;margin:26px 0;">
            <a th:href="${resetLink}" style="display:inline-block;background:#2563eb;color:#fff;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:8px;">RESET PASSWORD</a>
        </div>
        <p style="color:rgba(255,255,255,.4);font-size:12px;word-break:break-all;">Or copy this link: <span th:text="${resetLink}">https://...</span></p>
    </div>
    <p style="color:#f87171;font-size:13px;">This one-time link expires in <strong th:text="${expiryMinutes}">30</strong> minutes.</p>
    <p style="color:rgba(255,255,255,.32);font-size:12px;line-height:1.5;">If you did not request a password reset, you can safely ignore this email. Your password remains unchanged.</p>
</div>
</body>
</html>
