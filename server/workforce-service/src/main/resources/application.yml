server:
  port: 8091

spring:
  application:
    name: workforce-service
  thymeleaf:
    check-template-location: false
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/workforce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${WORKFORCE_STAFF_ACCESS_CONSUMER_GROUP:workforce-staff-projection-v1}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  signerKey: ${JWT_SIGNER_KEY:873bcf3b6023c6cfac735831cc01cbd59c6f64c2341050f12e5f0224d7edea62}

workforce:
  timezone: ${WORKFORCE_TIME_ZONE:Asia/Ho_Chi_Minh}
  staff-access-topic: ${STAFF_ACCESS_TOPIC:staff-access.events.v1}
  timesheet-topic: ${WORKFORCE_TIMESHEET_TOPIC:workforce.timesheet.events.v1}
  minimum-rest-hours: ${WORKFORCE_MINIMUM_REST_HOURS:12}
  clock-tolerance-minutes: ${WORKFORCE_CLOCK_TOLERANCE_MINUTES:5}
  outbox-poll-ms: ${WORKFORCE_OUTBOX_POLL_MS:1000}
  missing-punch-detection-ms: ${WORKFORCE_MISSING_PUNCH_DETECTION_MS:60000}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
