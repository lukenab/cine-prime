server:
  port: 8084 

spring:
  application:
    name: user-service 
    
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true     
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}