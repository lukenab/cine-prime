server:
  port: 8085
  forward-headers-strategy: framework

spring:
  application:
    name: concession-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/concession_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  signerKey: 873bcf3b6023c6cfac735831cc01cbd59c6f64c2341050f12e5f0224d7edea62

concession:
  internal-key: ${INTERNAL_SERVICE_KEY:local-dev-only-change-me}
  media:
    directory: ${CONCESSION_MEDIA_DIRECTORY:./data/concession-media}
  reservation:
    ttl-seconds: ${CONCESSION_RESERVATION_TTL_SECONDS:600}
    expiry-delay-ms: ${CONCESSION_EXPIRY_DELAY_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
