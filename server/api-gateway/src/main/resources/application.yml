
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS 
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: movie-service
          uri: lb://movie-service 
          predicates:
            - Path=/api/movie-service/**

        - id: booking-service
          uri: lb://booking-service # 
          predicates:
            - Path=/api/booking-service/**
            
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
            
eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8080