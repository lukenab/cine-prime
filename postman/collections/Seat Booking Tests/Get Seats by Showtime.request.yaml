$kind: http-request
name: Get Seats by Showtime
order: 1000
method: GET
url: '{{baseUrl}}/api/showtimes/{{showtimeId}}/seats'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has field 'code' equal to 1000", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.code).to.eql(1000);
      });

      pm.test("Response has field 'result' as array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.result).to.be.an('array');
      });

      pm.test("Each element in 'result' has required fields", function () {
          var jsonData = pm.response.json();
          jsonData.result.forEach(function (seat) {
              pm.expect(seat).to.have.property('seatId');
              pm.expect(seat).to.have.property('row');
              pm.expect(seat).to.have.property('number');
              pm.expect(seat).to.have.property('type');
              pm.expect(seat).to.have.property('status');
          });
      });

      // Save firstSeatId from first AVAILABLE seat
      var jsonData = pm.response.json();
      var availableSeats = jsonData.result.filter(function (seat) {
          return seat.status === 'AVAILABLE';
      });

      if (availableSeats.length > 0) {
          pm.collectionVariables.set('firstSeatId', availableSeats[0].seatId);
          pm.test("Saved firstSeatId: " + availableSeats[0].seatId, function () {
              pm.expect(availableSeats[0].seatId).to.exist;
          });
      }

      // Save list of AVAILABLE seat IDs
      var availableSeatIds = availableSeats.map(function (seat) { return seat.seatId; });
      pm.collectionVariables.set('availableSeatIds', JSON.stringify(availableSeatIds));
