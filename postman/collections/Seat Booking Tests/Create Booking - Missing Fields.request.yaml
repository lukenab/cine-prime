$kind: http-request
name: 'Create Booking - Missing Fields'
order: 5000
method: POST
url: '{{baseUrl}}/api/bookings'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("[Negative] Status code is NOT 200 (expect 400 or 500)", function () {
          pm.expect(pm.response.code).to.not.eql(200);
      });

      pm.test("[Negative] Status code is 4xx or 5xx", function () {
          pm.expect(pm.response.code).to.be.within(400, 599);
      });
