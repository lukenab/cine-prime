$kind: http-request
name: Get Seats After Booking
order: 4000
method: GET
url: '{{baseUrl}}/api/showtimes/{{showtimeId}}/seats'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has field 'code' equal to 1000", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.code).to.eql(1000);
      });

      pm.test("Booked seat is no longer AVAILABLE (status is LOCKED or BOOKED)", function () {
          var jsonData = pm.response.json();
          var firstSeatId = parseInt(pm.collectionVariables.get('firstSeatId'));
          var bookedSeat = jsonData.result.find(function (seat) {
              return seat.seatId === firstSeatId;
          });
          pm.expect(bookedSeat, 'Seat with firstSeatId should exist in result').to.exist;
          pm.expect(bookedSeat.status).to.be.oneOf(['LOCKED', 'BOOKED']);
      });
