openapi: 3.0.0
info:
  title: Movie Service API
  description: APIs for managing movies, cinema rooms, and movie types in the Cinema system.
  version: 1.0.0
tags:
  - name: Movie Controller
    description: APIs for managing movies in the Cinema system
paths:
  /api/movie/create:
    post:
      tags:
        - Movie Controller
      summary: Create a new movie
      description: API to create a movie along with its showtimes.
      operationId: createMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieRequest'
      responses:
        '200':
          description: Movie created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "200"
                message: "Movie created successfully"
                status: "OK"
        '400':
          description: Invalid input data (Validation or Business logic errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                ValidationError:
                  summary: Blank fields error
                  value:
                    code: "400"
                    message: "Vietnamese movie name cannot be blank; Director cannot be blank"
                    status: "BAD_REQUEST"
                InvalidShowtime:
                  summary: Invalid showtime hours (Custom code 900)
                  value:
                    code: "900"
                    message: "Invalid showtime! The cinema only operates from 8:00 AM to 11:00 PM"
                    status: "INTERNAL_SERVER_ERROR"
                InvalidShowdate:
                  summary: Invalid showdate (Custom code 902)
                  value:
                    code: "902"
                    message: "Invalid showdate! Showtimes must be scheduled at least 3 days in advance from today."
                    status: "INTERNAL_SERVER_ERROR"
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                GenreNotFound:
                  summary: Genre not found
                  value:
                    code: "404"
                    message: "Movie genre not found with the provided ID"
                    status: "NOT_FOUND"
                RoomNotFound:
                  summary: Cinema room not found (Custom code 904)
                  value:
                    code: "904"
                    message: "Cinema room does not exist."
                    status: "INTERNAL_SERVER_ERROR"
        '409':
          description: Data conflict error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                RoomScheduleConflict:
                  summary: Schedule conflict in room (Custom code 901)
                  value:
                    code: "901"
                    message: "Conflict: A movie schedule already exists in this room"
                    status: "CONFLICT"
                GeneralScheduleConflict:
                  summary: General room schedule conflict (Custom code 903)
                  value:
                    code: "903"
                    message: "The room has been booked for another showtime."
                    status: "INTERNAL_SERVER_ERROR"

  /api/movie/find/{id}:
    get:
      tags:
        - Movie Controller
      summary: Get movie by ID
      description: Returns a single movie object if it exists.
      operationId: getMovieById
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the movie to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Movie retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithData'
              example:
                code: 200
                message: "Movie retrieved successfully"
                result:
                  movieId: 1
                  actor: "Robert Downey Jr., Chris Evans, Scarlett Johansson"
                  content: "Sau sự kiện Infinity War, các siêu anh hùng còn sống sót tìm cách đảo ngược hậu quả do Thanos gây ra."
                  director: "Anthony Russo, Joe Russo"
                  duration: 181
                  movieProductionCompany: "Marvel Studios"
                  version: "2D"
                  movieNameEnglish: "Avengers: Endgame"
                  movieNameVn: "Avengers: Hồi Kết"
                  largeImage: "https://example.com/images/avengers-large.jpg"
                  smallImage: "https://example.com/images/avengers-small.jpg"
                  status: true
                  movieType:
                    - "Hành động"
                  showTimes:
                    - showTimeId: 1
                      showDate: "2026-11-30"
                      startTime: "08:00:00"
                      endTime: "11:01:00"
                      updateAt: null
                    - showTimeId: 2
                      showDate: "2026-10-30"
                      startTime: "08:00:00"
                      endTime: "11:01:00"
                      updateAt: null
                  createAt: "2026-06-15T02:51:46.966967Z"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "400"
                message: "Invalid request data error"
                status: "BAD_REQUEST"
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "404"
                message: "No matching movie found"
                status: "NOT_FOUND"

  /api/movie/find-all:
    get:
      tags:
        - Movie Controller
      summary: Get all movies
      description: Returns a list of all movies along with their genres and showtimes.
      operationId: getAllMovies
      responses:
        '200':
          description: Movie list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithList'
              example:
                code: 200
                message: "Movie list retrieved successfully"
                result:
                  - movieId: 1
                    actor: "Robert Downey Jr., Chris Evans, Scarlett Johansson"
                    content: "After the devastating events of Infinity War, the universe is in ruins. With the help of remaining allies, the Avengers assemble once more in order to reverse Thanos' actions."
                    director: "Anthony Russo, Joe Russo"
                    duration: 181
                    movieProductionCompany: "Marvel Studios"
                    version: "2D"
                    movieNameEnglish: "Avengers: Endgame"
                    movieNameVn: "Avengers: Hồi Kết"
                    largeImage: "https://example.com/images/avengers-large.jpg"
                    smallImage: "https://example.com/images/avengers-small.jpg"
                    status: true
                    movieConnects:
                      - "Action"
                    showTimes:
                      - showTimeId: 1
                        showDate: "2026-11-30"
                        startTime: "08:00:00"
                        endTime: "11:01:00"
                        updateAt: null
                      - showTimeId: 2
                        showDate: "2026-10-30"
                        startTime: "08:00:00"
                        endTime: "11:01:00"
                        updateAt: null
                    createAt: "2026-06-15T02:51:46.966967"
        '404':
          description: Movies not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "404"
                message: "No movies found"
                status: "NOT_FOUND"

  /api/movie/create-room:
    post:
      tags:
        - Movie Controller
      summary: Create a cinema room
      description: Creates a new cinema room and returns the operation status.
      operationId: createCinemaRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CinemaRoomRequest'
      responses:
        '200':
          description: Cinema room created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "200"
                message: "Cinema room created successfully"
                status: "OK"
        '409':
          description: Cinema room conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "409"
                message: "Room name already exists!!!"
                status: "CONFLICT"

  /api/movie/create-type:
    post:
      tags:
        - Movie Controller
      summary: Create a movie type/genre
      description: Creates a new movie genre and returns the operation status.
      operationId: createTypeMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypeRequest'
      responses:
        '200':
          description: Movie type created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "200"
                message: "Movie type created successfully"
                status: "OK"
        '409':
          description: Movie type conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "409"
                message: "Movie type name already exists!!!"
                status: "CONFLICT"

components:
  schemas:
    CreateMovieRequest:
      type: object
      required:
        - movieNameVn
        - director
        - typeIds
        - showTimes
      properties:
        movieNameVn:
          type: string
          example: "Avengers: Hồi Kết"
        movieNameEnglish:
          type: string
          example: "Avengers: Endgame"
        director:
          type: string
          example: "Anthony Russo, Joe Russo"
        actor:
          type: string
          example: "Robert Downey Jr., Chris Evans, Scarlett Johansson"
        content:
          type: string
          example: "Sau sự kiện Infinity War, các siêu anh hùng còn sống sót tìm cách đảo ngược hậu quả do Thanos gây ra."
        duration:
          type: integer
          example: 181
        version:
          type: string
          example: "2D"
        movieProductionCompany:
          type: string
          example: "Marvel Studios"
        smallImage:
          type: string
          example: "https://example.com/images/avengers-small.jpg"
        largeImage:
          type: string
          example: "https://example.com/images/avengers-large.jpg"
        status:
          type: integer
          description: "1 = Active, 0 = Inactive"
          example: 1
        typeIds:
          type: array
          items:
            type: integer
          example: [1]
        showTimes:
          type: array
          items:
            $ref: '#/components/schemas/ShowTimeRequest'
          example:
            - cinemaRoomId: 1
              showDate: "2026-11-30"
              startTime: "08:00:00"
            - cinemaRoomId: 1
              showDate: "2026-10-30"
              startTime: "08:00:00"

    ShowTimeRequest:
      type: object
      required:
        - cinemaRoomId
        - showDate
        - startTime
      properties:
        cinemaRoomId:
          type: integer
          example: 1
        showDate:
          type: string
          format: date
          example: "2026-11-30"
        startTime:
          type: string
          example: "08:00:00"

    CinemaRoomRequest:
      type: object
      required:
        - cinemaRoomName
        - seatQuantity
        - status
      properties:
        cinemaRoomName:
          type: string
          example: "Phòng số 2"
        seatQuantity:
          type: integer
          example: 100
        status:
          type: integer
          description: "1 = Active, 0 = Inactive"
          example: 1

    TypeRequest:
      type: object
      required:
        - typeName
      properties:
        typeName:
          type: string
          example: "Action"

    ApiResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "Operation successful"
        status:
          type: string
          example: "OK"

    ApiResponseWithData:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "Successful"
        status:
          type: string
          example: "OK"
        data:
          $ref: '#/components/schemas/MovieDetailResponse'

    ApiResponseWithList:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "Successful"
        result:
          type: array
          items:
            $ref: '#/components/schemas/MovieDetailResponse'

    MovieDetailResponse:
      type: object
      properties:
        movieId:
          type: integer
          example: 1
        actor:
          type: string
          example: "Robert Downey Jr., Chris Evans, Scarlett Johansson"
        content:
          type: string
          example: "Sau sự kiện Infinity War, các siêu anh hùng còn sống sót tìm cách đảo ngược hậu quả do Thanos gây ra."
        director:
          type: string
          example: "Anthony Russo, Joe Russo"
        duration:
          type: integer
          example: 181
        movieProductionCompany:
          type: string
          example: "Marvel Studios"
        version:
          type: string
          example: "2D"
        movieNameEnglish:
          type: string
          example: "Avengers: Endgame"
        movieNameVn:
          type: string
          example: "Avengers: Hồi Kết"
        largeImage:
          type: string
          example: "https://example.com/images/avengers-large.jpg"
        smallImage:
          type: string
          example: "https://example.com/images/avengers-small.jpg"
        status:
          type: boolean
          example: true
        movieType:
          type: array
          items:
            type: string
          example:
            - "Hành động"
        showTimes:
          type: array
          items:
            $ref: '#/components/schemas/ShowTimeResponse'
          example:
            - showTimeId: 1
              showDate: "2026-11-30"
              startTime: "08:00:00"
              endTime: "11:01:00"
              updateAt: null
            - showTimeId: 2
              showDate: "2026-10-30"
              startTime: "08:00:00"
              endTime: "11:01:00"
              updateAt: null
        createAt:
          type: string
          format: date-time
          example: "2026-06-15T02:51:46.966967Z"

    ShowTimeResponse:
      type: object
      properties:
        showTimeId:
          type: integer
          example: 1
        showDate:
          type: string
          format: date
          example: "2026-11-30"
        startTime:
          type: string
          example: "08:00:00"
        endTime:
          type: string
          example: "11:01:00"
        updateAt:
          type: string
          nullable: true
          example: null