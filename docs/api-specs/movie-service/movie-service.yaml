openapi: 3.0.0
info:
  title: Movie Service API
  description: APIs for managing movies, cinema rooms, and movie types in the Cinema system. CinePrime movie service updates and soft delete
  version: 1.0.0

tags:
  - name: Movie Controller
    description: APIs for managing movies in the Cinema system
  - name: Cinema Cluster Controller
    description: APIs for managing cinema clusters and their audit fields

paths:
  /api/movie:
    post:
      tags:
        - Movie Controller
      summary: Create a new movie
      description: API to create a movie along with its showtimes.
      operationId: createMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieRequest"
      responses:
        "200":
          description: Movie created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/MovieDetailResponse"
              example:
                code: "202"
                result:
                  movieId: 11
                  actor: "Robert Downey Jr., Chris Evans, Scarlett Johansson"
                  content: "Sau sự kiện Infinity War, các siêu anh hùng còn sống sót tìm cách đảo ngược hậu quả do Thanos gây ra."
                  director: "Anthony Russo, Joe Russo"
                  duration: 181
                  movieProductionCompany: "Marvel Studios"
                  version: "2D"
                  movieNameEnglish: "Avengers: Endgame"
                  movieNameVn: "Avengers: Hồi Kết"
                  largeImage: "http://res.cloudinary.com/dzlfgmtbc/image/upload/v1781710885/gyy9rdenyjcoaqmem1uq.jpg"
                  smallImage: "http://res.cloudinary.com/dzlfgmtbc/image/upload/v1781710882/zrolvj5bfzpde3b3jc8e.jpg"
                  status: true
                  movieType:
                    - "Hành động"
                  showTimes:
                    - showTimeId: 1
                      showDate: "2026-11-30"
                      startTime: "08:00:00"
                      endTime: "11:01:00"
                      updateAt: null
                    - showTimeId: 2
                      showDate: "2026-10-30"
                      startTime: "08:00:00"
                      endTime: "11:01:00"
                      updateAt: null
                  createAt: "2026-06-17T22:41:18.435793Z"
        "400":
          description: Bad Request - Invalid request data format or business rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                INVALID_SHOWTIME:
                  summary: Invalid Showtime (2006)
                  value:
                    code: "2006"
                    message: "Invalid showtime! The cinema only operates from 8:00 AM to 11:00 PM"
                INVALID_SHOWDATE:
                  summary: Invalid Showdate (2008)
                  value:
                    code: "2008"
                    message: "Invalid showdate! Showtimes must be scheduled at least 3 days in advance from today."
        "404":
          description: Not Found - The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                MOVIE_TYPE_NOT_FOUND:
                  summary: Movie Genre Not Found (2001)
                  value:
                    code: "2001"
                    message: "Movie genre not found with the provided ID."
                MOVIE_NOT_FOUND:
                  summary: Movie Not Found (2002)
                  value:
                    code: "2002"
                    message: "Movie not found."
                CINEMA_ROOM_NOT_FOUND:
                  summary: Cinema Room Not Found (2003)
                  value:
                    code: "2003"
                    message: "Cinema room does not exist."
        "409":
          description: Conflict - Data duplication or scheduling conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                SHOWTIME_CONFLICT_IN_REQUEST:
                  summary: Showtime Conflict In Request (2007)
                  value:
                    code: "2007"
                    message: "Conflict: A movie schedule already exists in this room"
                SHOWTIME_CONFLICT_IN_DATABASE:
                  summary: Showtime Conflict In Database (2009)
                  value:
                    code: "2009"
                    message: "The room has been booked for another showtime."
        "500":
          description: Internal Server Error - Server-side exception.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                INTERNAL_SERVER_ERROR:
                  summary: Internal Server Error (5000)
                  value:
                    code: "5000"
                    message: "Internal server error"
                UPLOAD_IMAGE_FAILED:
                  summary: Upload Image Failed (5001)
                  value:
                    code: "5001"
                    message: "Failed to upload image to Cloudinary"
    get:
      tags:
        - Movie Controller
      summary: Get movies with pagination
      description: Returns paginated movies.
      operationId: getPageMovies
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Movies retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePageMovie"
        "404":
          description: No movies found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              example:
                code: "404"
                message: "No movies found"

  /api/movie/{id}:
    get:
      tags:
        - Movie Controller
      summary: Get movie by ID
      description: Returns a single movie object if it exists.
      operationId: getMovieById
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the movie to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Movie retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/MovieDetailResponse"
              example:
                code: "200"
                status: "OK"
                message: "Movie retrieved successfully"
                result:
                  movieId: 1
                  actor: "Robert Downey Jr., Chris Evans, Scarlett Johansson"
                  content: "Following the events of Infinity War, the surviving superheroes seek to reverse the damage caused by Thanos."
                  director: "Anthony Russo, Joe Russo"
                  duration: 181
                  movieProductionCompany: "Marvel Studios"
                  version: "2D"
                  movieNameEnglish: "Avengers: Endgame"
                  movieNameVn: "Avengers: Hồi Kết"
                  largeImage: "https://example.com/images/avengers-large.jpg"
                  smallImage: "https://example.com/images/avengers-small.jpg"
                  status: true
                  movieType:
                    - "Action"
                  showTimes:
                    - showTimeId: 1
                      showDate: "2026-11-30"
                      startTime: "08:00:00"
                      endTime: "11:01:00"
                      updateAt: null
                    - showTimeId: 2
                      showDate: "2026-10-30"
                      startTime: "08:00:00"
                      endTime: "11:01:00"
                      updateAt: null
                  createAt: "2026-06-15T02:51:46.966967Z"
    put:
      tags:
        - Movie Controller
      summary: Cập nhật thông tin phim
      description: API cập nhật các trường thông tin của phim.
      operationId: updateMovie
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the movie to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovieRequest'
      responses:
        '200':
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithData'
              example:
                code: "200"
                message: "Lấy movie thành công"
                status: "OK"
                data:
                  movieId: 1
                  actor: "Luffy, Uta"
                  content: "Câu chuyện..."
                  director: "Goro Taniguchi"
                  duration: 115
                  movieProductionCompany: "Toei Animation"
                  version: "2D"
                  movieNameEnglish: "One Piece Film Red"
                  movieNameVn: "One Piece Film Red"
                  largeImage: "https://cloudinary.com/movie-large.jpg"
                  smallImage: "https://cloudinary.com/movie-small.jpg"
                  status: true
                  movieTypes:
                    - "Action"
                    - "Anime"
                  createAt: "15-06-2026 22:00"
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              examples:
                ValidationError:
                  summary: Tên phim tiếng Việt trống
                  value:
                    code: "400"
                    message: "Tên phim tiếng Việt không được để trống"
                    status: "BAD_REQUEST"
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                MovieNotFound:
                  summary: Phim cần cập nhật không tồn tại
                  value:
                    code: "404"
                    message: "Không tìm thấy phim với ID: 999"
                    status: "NOT_FOUND"
                GenreNotFound:
                  summary: Thể loại phim liên kết không tồn tại
                  value:
                    code: "404"
                    message: "Không tìm thấy thể loại với ID: 999"
                    status: "NOT_FOUND"
        '409':
          description: Data conflict error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                UniqueConstraintConflict:
                  summary: Tên phim đã tồn tại
                  value:
                    code: "409"
                    message: "Tên phim tiếng Việt đã tồn tại trong hệ thống"
                    status: "CONFLICT"
        '500':
          description: Lỗi máy chủ hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "500"
                message: "Lỗi máy chủ nội bộ"
                status: "INTERNAL_SERVER_ERROR"
    delete:
      tags:
        - Movie Controller
      summary: Xóa mềm phim
      description: API cập nhật trạng thái phim thành ngưng hoạt động (soft delete)
      operationId: deleteMovie
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the movie to delete
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Movie deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "200"
                message: "Xóa movie thành công"
                status: "OK"
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "404"
                message: "Không tìm thấy phim với ID: 999"
                status: "NOT_FOUND"
        '409':
          description: Business rule conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "409"
                message: "Không thể xóa phim vì vẫn còn suất chiếu hoạt động trong tương lai"
                status: "CONFLICT"
        '500':
          description: Lỗi máy chủ hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: "500"
                message: "Lỗi máy chủ nội bộ"
                status: "INTERNAL_SERVER_ERROR"

  /api/movie/room:
    post:
      tags:
        - Movie Controller
      summary: Create a cinema room
      description: Creates a new cinema room and returns the operation status.
      operationId: createCinemaRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CinemaRoomRequest"
      responses:
        "200":
          description: Cinema room created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/CinemaRoomResponse"
              example:
                code: "200"
                result:
                  cinemaRoomId: 1
                  cinemaRoomName: "Room 2"
                  seatQuantity: 100
        "409":
          description: Cinema room conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              example:
                code: "2004"
                message: "Room name already exists!!!"

  /api/movie/type:
    post:
      tags:
        - Movie Controller
      summary: Create a movie type
      description: Creates a new movie type and returns the operation status.
      operationId: createTypeMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypeRequest"
      responses:
        "200":
          description: Movie type created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TypeMovieResponse"
              example:
                code: "202"
                result:
                  typeId: 1
                  typeName: "Action"
        "409":
          description: Movie type conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              example:
                code: "2005"
                message: "Movie type name already exists!!!"

  /api/cinema-clusters:
    post:
      tags:
        - Cinema Cluster Controller
      summary: Create a cinema cluster
      description: ADMIN creates an ACTIVE cluster; EMPLOYEE creates a DRAFT cluster. The authenticated JWT principal is saved as createdBy.
      operationId: createCinemaCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CinemaClusterRequest"
      responses:
        "200":
          description: Cluster created successfully. The response body code is 201.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  result:
                    $ref: "#/components/schemas/CinemaClusterResponse"

  /api/cinema-clusters/{id}:
    put:
      tags:
        - Cinema Cluster Controller
      summary: Update a cinema cluster
      description: Updates cluster data and saves the authenticated JWT principal as updatedBy while preserving createdBy.
      operationId: updateCinemaCluster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CinemaClusterRequest"
      responses:
        "200":
          description: Cluster updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/CinemaClusterResponse"

  /api/cinema-room-master-data:
    get:
      tags:
        - Room Master Data Controller
      summary: Aggregate master data for the Cinema Room creation wizard
      description: Read-only. Frontend dropdowns and quick-start room templates must consume this instead of hardcoding lists.
      operationId: getCinemaRoomMasterData
      responses:
        "200":
          description: Master data returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/CinemaRoomMasterDataResponse"

  /api/cinema-rooms/{roomId}/layouts:
    get:
      tags:
        - Room Layout Controller
      summary: List all layout versions for a room
      operationId: listRoomLayouts
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Layout version summaries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomLayoutSummaryResponse"

  /api/cinema-rooms/{roomId}/layouts/{layoutId}:
    get:
      tags:
        - Room Layout Controller
      summary: Get one layout version, including all positions
      operationId: getRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Layout detail returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"
    put:
      tags:
        - Room Layout Controller
      summary: Replace the position set of a DRAFT layout
      description: Rejected with ROOM_LAYOUT_NOT_EDITABLE (2046) unless the layout is DRAFT. personCapacity/sellableUnitCount are always recomputed server-side.
      operationId: saveRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomLayoutSaveRequest"
      responses:
        "200":
          description: Layout saved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"

  /api/cinema-rooms/{roomId}/layouts/{layoutId}/submit:
    post:
      tags:
        - Room Layout Controller
      summary: Submit a DRAFT layout for approval (DRAFT -> PENDING_APPROVAL)
      description: >-
        Revalidates the stored layout against the room planning envelope before transition.
        Returns ROOM_LAYOUT_EXCEEDS_ROOM_ENVELOPE (2063) when person capacity, minimum
        seat-row footprint, or screen-clearance depth exceeds the configured room dimensions.
      operationId: submitRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Layout submitted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"

  /api/cinema-rooms/{roomId}/layouts/{layoutId}/approve:
    post:
      tags:
        - Room Layout Controller
      summary: Approve a PENDING_APPROVAL layout (ADMIN only)
      operationId: approveRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Layout approved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"

  /api/cinema-rooms/{roomId}/layouts/{layoutId}/reject:
    post:
      tags:
        - Room Layout Controller
      summary: Reject a PENDING_APPROVAL layout back to DRAFT (ADMIN only)
      operationId: rejectRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  example: "Couple rows too close to the exit — please move them."
      responses:
        "200":
          description: Layout rejected successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"

  /api/cinema-rooms/{roomId}/layouts/{layoutId}/activate:
    post:
      tags:
        - Room Layout Controller
      summary: Activate an APPROVED layout (ADMIN only) — syncs the seat table
      description: Blocked with ROOM_LAYOUT_HAS_FUTURE_SHOWTIMES (2051) if the room has an ACTIVE layout and any SCHEDULED/ON_SALE showtime today or later.
      operationId: activateRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Layout activated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"

  /api/cinema-rooms/{roomId}/layouts/{layoutId}/clone:
    post:
      tags:
        - Room Layout Controller
      summary: Clone a layout version into a new DRAFT version+1
      description: Rejected with ROOM_LAYOUT_INVALID_TRANSITION if the source is DRAFT or PENDING_APPROVAL.
      operationId: cloneRoomLayout
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: layoutId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: Layout cloned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  result:
                    $ref: "#/components/schemas/RoomLayoutResponse"

components:
  schemas:
    MasterDataItemResponse:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: "STANDARD"
        name:
          type: string
          example: "Standard"
        description:
          type: string
          nullable: true

    CinemaRoomMasterDataResponse:
      type: object
      properties:
        auditoriumClasses:
          type: array
          description: >-
            Active commercial service tiers only (STANDARD, PREMIUM, LUXURY,
            PRIVATE). This classification is independent from presentation/audio
            capabilities, seat mix and capacity; PLF and MOTION are not service tiers.
          items:
            $ref: "#/components/schemas/MasterDataItemResponse"
        projectionTechnologies:
          type: array
          items:
            $ref: "#/components/schemas/MasterDataItemResponse"
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/MasterDataItemResponse"
        audioFormats:
          type: array
          items:
            $ref: "#/components/schemas/MasterDataItemResponse"
        presentationSystems:
          type: array
          description: Commercial presentation system, independent from projection technology and 2D/3D format.
          items:
            type: string
            enum: [STANDARD, IMAX, DOLBY_CINEMA, SCREENX]
        roomTemplates:
          type: array
          description: Database-managed operational defaults. Identity and physical/screen measurements are never templated.
          items:
            $ref: "#/components/schemas/RoomConfigurationTemplateResponse"
        seatTypes:
          type: array
          items:
            type: string
          example: ["STANDARD", "VIP", "COUPLE", "ACCESSIBLE"]
        numberingDirections:
          type: array
          items:
            type: string
          example: ["LEFT_TO_RIGHT", "RIGHT_TO_LEFT"]
        layoutPositionTypes:
          type: array
          items:
            type: string
          example: ["SEAT", "AISLE", "EXIT", "EMPTY_SPACE"]
        roomStatuses:
          type: array
          items:
            type: string
        layoutStatuses:
          type: array
          items:
            type: string

    RoomConfigurationTemplateResponse:
      type: object
      required: [id, code, name, auditoriumClassId, projectionTechnologyId, resolutionId, audioFormatId, numberOfRows, maxPositionsPerRow, layoutTemplateCode]
      properties:
        id: { type: integer }
        code: { type: string, example: PREMIUM_LASER }
        name: { type: string, example: Premium Laser }
        description: { type: string, nullable: true }
        auditoriumClassId: { type: integer }
        projectionTechnologyId: { type: integer }
        resolutionId: { type: integer }
        audioFormatId: { type: integer }
        supports2d: { type: boolean }
        supports3d: { type: boolean }
        numberOfRows: { type: integer, example: 12 }
        maxPositionsPerRow: { type: integer, example: 16 }
