        - operatingHours
      properties:
        clusterCode:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{1,19}$'
          example: "CP-HCM-01"
        clusterName:
          type: string
          minLength: 2
          maxLength: 100
          example: "CinePrime Quận 1"
        venueType:
          type: string
          enum: [MALL, STANDALONE, MIXED_USE]
