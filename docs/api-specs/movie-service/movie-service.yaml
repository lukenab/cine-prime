          type: string
          example: "VN"
        province:
          type: string
          example: "TP. Hồ Chí Minh"
        district:
          type: string
          example: "Quận 1"
        ward:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        buildingName:
          type: string
          nullable: true
        floorLocation:
          type: string
          nullable: true
        address:
          type: string
          minLength: 10
          maxLength: 255
          example: "123 Nguyễn Huệ, Quận 1"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
