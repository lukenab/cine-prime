openapi: 3.0.3
info:
  title: Movie Service - Auto Showtime Generation API
  version: 1.0.0
  description: |
    Admin-only API for demand-based automatic showtime generation.
    A newly submitted run is validated before persistence: every selected movie
    must have at least one eligible candidate in the requested date and cluster scope.

servers:
  - url: http://localhost:8080
    description: Local API Gateway
  - url: http://localhost:8081
    description: Local Movie Service (direct)

tags:
  - name: Auto Showtime Generation
    description: Submit, execute and inspect automatic showtime generation runs.

paths:
  /api/schedules/auto-generation-runs:
    post:
      tags: [Auto Showtime Generation]
      summary: Submit an automatic showtime generation run
      operationId: submitAutoShowtimeGenerationRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoShowtimeGenerationRequest'
            example:
              startDate: '2026-07-25'
              endDate: '2026-07-25'
              cinemaClusterIds: [7]
              movieIds: [2, 4]
      responses:
        '202':
          description: Run accepted, or existing idempotent run returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          description: Invalid date range or one or more selected movies have no eligible candidate.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/IneligibleMoviesErrorResponse'
              examples:
                invalidRange:
                  value:
                    code: 2095
                    message: The requested date range is outside the configured scheduling horizon.
                    result: null
                ineligibleMovie:
                  value:
                    code: 2100
                    message: Every selected movie must have at least one eligible showtime candidate.
                    result:
                      ineligibleMovies:
                        - movieId: 1
                          originalTitle: AUTO_SHOWTIME_TEST_2D
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: A movie, cluster or active allocation policy was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: At least one selected movie is not APPROVED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/schedules/auto-generation-runs/{generationRunId}/execute:
    post:
      tags: [Auto Showtime Generation]
      summary: Execute an accepted generation run immediately
      description: |
        QA/operations endpoint. The scheduler uses the same service method for ACCEPTED runs.
        Re-executing a non-ACCEPTED run only returns its stored summary and does not create duplicates.
      operationId: executeAutoShowtimeGenerationRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenerationRunId'
      responses:
        '200':
          description: Execution completed or existing execution summary returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Generation run not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/schedules/auto-generation-runs/{generationRunId}:
    get:
      tags: [Auto Showtime Generation]
      summary: Get a generation run and persisted showtimes
      operationId: getAutoShowtimeGenerationRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenerationRunId'
        - name: page
          in: query
          required: false
          description: Negative values are normalized to 0 by the service.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: The service clamps this value to the range 1..100.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Run state, allocation summary, per-movie totals and one page of persisted showtimes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Generation run not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GenerationRunId:
      name: generationRunId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Unauthenticated:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user does not have ADMIN role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AutoShowtimeGenerationRequest:
      type: object
      required: [startDate, endDate, cinemaClusterIds, movieIds]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        cinemaClusterIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        movieIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64

    AcceptedResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
          example: 202
        message:
          type: string
          example: Auto showtime generation run accepted
        result:
          $ref: '#/components/schemas/AutoShowtimeGenerationAccepted'

    AutoShowtimeGenerationAccepted:
      type: object
      required: [generationRunId, status, startDate, endDate]
      properties:
        generationRunId:
          type: integer
          format: int64
          example: 15
        status:
          $ref: '#/components/schemas/GenerationRunStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    ExecutionResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Auto showtime generation run executed
        result:
          $ref: '#/components/schemas/AutoShowtimeExecutionResult'

    AutoShowtimeExecutionResult:
      type: object
      required: [generationRunId, status, candidateCount, createdCount, skippedCount]
      properties:
        generationRunId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/GenerationRunStatus'
        candidateCount:
          type: integer
          format: int32
          minimum: 0
        createdCount:
          type: integer
          format: int32
          minimum: 0
        skippedCount:
          type: integer
          format: int32
          minimum: 0

    RunDetailsResponse:
      type: object
      required: [code, result]
      properties:
        code:
          type: integer
          example: 200
        result:
          $ref: '#/components/schemas/AutoShowtimeGenerationRun'

    AutoShowtimeGenerationRun:
      type: object
      required:
        - generationRunId
        - status
        - startDate
        - endDate
        - summary
        - movieResults
        - showtimes
      properties:
        generationRunId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/GenerationRunStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        summary:
          $ref: '#/components/schemas/GenerationSummary'
        movieResults:
          type: array
          items:
            $ref: '#/components/schemas/MovieGenerationResult'
        showtimes:
          $ref: '#/components/schemas/GeneratedShowtimePage'
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        failureDetail:
          type: string
          nullable: true

    GenerationSummary:
      type: object
      required: [candidateCount, createdCount, skippedCount]
      properties:
        candidateCount:
          type: integer
          format: int32
        createdCount:
          type: integer
          format: int32
        skippedCount:
          type: integer
          format: int32

    MovieGenerationResult:
      type: object
      required: [movieId, movieTitle, candidateCount, createdCount, skippedCount]
      properties:
        movieId:
          type: integer
          format: int64
        movieTitle:
          type: string
        demandTier:
          type: string
          enum: [HIGH, NORMAL, LOW]
          nullable: true
        candidateCount:
          type: integer
          format: int32
        createdCount:
          type: integer
          format: int32
        skippedCount:
          type: integer
          format: int32

    GeneratedShowtimePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedShowtime'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    GeneratedShowtime:
      type: object
      required:
        - showtimeId
        - movieId
        - cinemaClusterId
        - cinemaRoomId
        - formatId
        - showDate
        - startTime
        - endTime
        - status
        - generationReason
      properties:
        showtimeId:
          type: integer
          format: int64
        movieId:
          type: integer
          format: int64
        movieTitle:
          type: string
        cinemaClusterId:
          type: integer
          format: int64
        cinemaRoomId:
          type: integer
          format: int64
        cinemaRoomName:
          type: string
        formatId:
          type: integer
          format: int32
        formatName:
          type: string
        showDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          type: string
        generationReason:
          type: string
          enum:
            - MINIMUM_DAILY_COVERAGE
            - PREMIUM_FORMAT_PRIORITY
            - HIGH_DEMAND_PEAK_SLOT
            - HIGH_DEMAND_OFF_PEAK_SLOT
            - DEMAND_QUOTA_ALLOCATION

    GenerationRunStatus:
      type: string
      enum: [ACCEPTED, RUNNING, COMPLETED, PARTIALLY_COMPLETED, FAILED]

    IneligibleMoviesErrorResponse:
      type: object
      required: [code, message, result]
      properties:
        code:
          type: integer
          example: 2100
        message:
          type: string
        result:
          type: object
          required: [ineligibleMovies]
          properties:
            ineligibleMovies:
              type: array
              items:
                $ref: '#/components/schemas/IneligibleMovie'

    IneligibleMovie:
      type: object
      required: [movieId, originalTitle]
      properties:
        movieId:
          type: integer
          format: int64
        originalTitle:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        result:
          nullable: true
