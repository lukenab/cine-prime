openapi: 3.0.1
info:
  title: CinePrime Auth Service API
  description: OpenAPI specification for the CinePrime authentication service. Defines endpoints for user registration, authentication, and RBAC (Roles & Permissions) management.
  version: 1.0.0
servers:
  - url: http://localhost:8088
    description: Auth Service Local Server
  - url: http://localhost:8085
    description: API Gateway
tags:
  - name: Authentication
    description: Endpoints for user registration and login
  - name: Permission
    description: Endpoints for managing system permissions
paths:
  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================
  /api/auth/register/initiate:
    post:
      tags:
        - Authentication
      summary: Initiate registration by sending OTP
      description: Validates the registration payload and sends a 6-digit OTP to the user's email if the username and email are available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP successfully sent to email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'
        '400':
          description: Bad Request - Username or Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                UsernameExisted:
                  summary: "Error 1010: Username Existed"
                  value:
                    code: 1010
                    message: "Username already exists!"
                EmailExisted:
                  summary: "Error 1011: Email Existed"
                  value:
                    code: 1011
                    message: "Email already exists!"

  /api/auth/register/verify:
    post:
      tags:
        - Authentication
      summary: Verify OTP and register user
      description: Verifies OTP and creates the account. Note that this API communicates with `user-service` to create the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegisterResponse'
        '400':
          description: Bad Request - Validation failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                InvalidOtp:
                  summary: "Error 1013: Invalid OTP"
                  value:
                    code: 1013
                    message: "Otp invalid"
                PhoneExisted:
                  summary: "Error 2001: Phone Existed (From User Service)"
                  value:
                    code: 2001
                    message: "Phone number already exists!"

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user and return token
      description: Authenticates the user using username and password. Returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthenticationResponse'
        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Unauthenticated:
                  summary: "Error 1008: Unauthenticated"
                  value:
                    code: 1008
                    message: "Unauthenticated"

  # ==========================================
  # PERMISSION ENDPOINTS
  # ==========================================
  /api/permissions:
    post:
      tags:
        - Permission
      summary: Create a new permission
      description: Creates a new system permission to be used in RBAC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionRequest'
      responses:
        '200':
          description: Permission successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionResponse'
    get:
      tags:
        - Permission
      summary: Get all permissions
      description: Retrieves a list of all existing permissions in the system.
      responses:
        '200':
          description: List of permissions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPermissionResponse'

  /api/permissions/{permissionId}:
    delete:
      tags:
        - Permission
      summary: Delete a permission
      description: Removes a permission from the system using its ID (name).
      parameters:
        - name: permissionId
          in: path
          required: true
          description: The unique name of the permission
          schema:
            type: string
            example: "UPDATE_DATA"
      responses:
        '200':
          description: Permission deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

components:
  schemas:
    # --- REQUEST SCHEMAS ---
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          example: "john_doe"
        password:
          type: string
          format: password
          example: "Password123@"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        fullName:
          type: string
          example: "John Doe"
        phoneNumber:
          type: string
          example: "0123456789"
        dateOfBirth:
          type: string
          format: date
          example: "1995-10-15"
        gender:
          type: string
          example: "MALE"
        address:
          type: string
          example: "123 Main Street, Tech City"
        identityCard:
          type: string
          example: "079012345678"

    VerifyOtpRequest:
      type: object
      required: [otp, registerRequest]
      properties:
        otp:
          type: string
          example: "654321"
        registerRequest:
          $ref: '#/components/schemas/RegisterRequest'

    AuthenticationRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "john_doe"
        password:
          type: string
          format: password
          example: "Password123@"

    PermissionRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          example: "UPDATE_DATA"
        description:
          type: string
          example: "Update data permission"

    RoleRequest:
      type: object
      required: [roleName, description]
      properties:
        roleName:
          type: string
          example: "ADMIN"
        description:
          type: string
          example: "Administrator Role"
        permissions:
          type: array
          items:
            type: string
          example: ["UPDATE_DATA", "CREATE_USER"]

    # --- CORE RESPONSE SCHEMAS ---
    AuthenticationResponse:
      type: object
      properties:
        authenticate:
          type: boolean
          example: true
        token:
          type: string
          example: "eyJhbGciOiJIUzUxMiJ9..."

    RegisterResponse:
      type: object
      properties:
        accountId:
          type: string
          example: "acc-uuid-1234-5678"
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          example: "johndoe@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-14T15:00:00Z"

    PermissionResponse:
      type: object
      properties:
        name:
          type: string
          example: "UPDATE_DATA"
        description:
          type: string
          example: "Update data permission"

    RoleResponse:
      type: object
      properties:
        roleName:
          type: string
          example: "ADMIN"
        description:
          type: string
          example: "Administrator Role"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'

    # --- WRAPPER RESPONSES (API RESPONSE STANDARD) ---
    ApiResponseString:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "Success"
        result:
          type: string
          example: "OTP has been sent to your email"

    ApiResponseRegisterResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "Success"
        result:
          $ref: '#/components/schemas/RegisterResponse'

    ApiResponseAuthenticationResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "Success"
        result:
          $ref: '#/components/schemas/AuthenticationResponse'

    ApiResponsePermissionResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "Success"
        result:
          $ref: '#/components/schemas/PermissionResponse'

    ApiResponseListPermissionResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "Success"
        result:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'

    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "Success"

    # --- ERROR RESPONSE SCHEMA ---
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1003
        message:
          type: string
          example: "Uncategorized error!"