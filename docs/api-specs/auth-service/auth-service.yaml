openapi: 3.0.1
info:
  title: CinePrime Auth Service API
  description: OpenAPI specification for the CinePrime authentication service. Defines endpoints for user registration, authentication, account management, and RBAC (Roles & Permissions) management.
  version: 1.2.0
servers:
  - url: http://localhost:8088
    description: Auth Service Local Server
  - url: http://localhost:8085
    description: API Gateway
tags:
  - name: Authentication
    description: Endpoints for user registration and login
  - name: Account
    description: Endpoints for managing accounts (admin)
  - name: Permission
    description: Endpoints for managing system permissions
  - name: Role
    description: Endpoints for managing system roles
paths:
  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================
  /api/auth/register/initiate:
    post:
      tags:
        - Authentication
      summary: Initiate registration by sending OTP
      description: Validates the registration payload and sends a 6-digit OTP to the user's email if the username and email are available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP successfully sent to email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'
              example:
                code: 1000
                result: "OTP has been sent to your email"
        '400':
          description: Bad Request - Username or Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                UsernameExisted:
                  summary: "Error 1010: Username Existed"
                  value:
                    code: 1010
                    message: "Username already exists!"
                EmailExisted:
                  summary: "Error 1011: Email Existed"
                  value:
                    code: 1011
                    message: "Email already exists!"
                PhoneExisted:
                  summary: "Error 1017: Phone Existed"
                  value:
                    code: 1017
                    message: "Phone number already exists in the system!"
                IdentityCardExisted:
                  summary: "Error 1018: Identity Card Existed"
                  value:
                    code: 1018
                    message: "Identity card (CCCD) already exists in the system!"

  /api/auth/register/verify:
    post:
      tags:
        - Authentication
      summary: Verify OTP and register user
      description: Verifies OTP and creates the account. After successful account creation, a `UserRegisteredEvent` is published to Kafka topic `user-register-topic` for async user profile creation in `user-service`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: User successfully registered and event published to Kafka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountResponse'
              example:
                code: 1000
                result:
                  accountId: "acc-uuid-1234-5678"
                  username: "john_doe"
                  email: "johndoe@example.com"
                  createdAt: "2026-06-14T15:00:00"
                  roles:
                    - roleName: "USER"
                      description: "Default user role"
                      permissions: []
        '400':
          description: Bad Request - Validation failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                InvalidOtp:
                  summary: "Error 1013: Invalid OTP"
                  value:
                    code: 1013
                    message: "Otp invalid"
                OtpExpired:
                  summary: "Error 1015: OTP Expired"
                  value:
                    code: 1015
                    message: "Otp has expired"
                DefaultRoleNotFound:
                  summary: "Error 1012: Default Role Not Found"
                  value:
                    code: 1012
                    message: "Default role not found!"

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user and return token
      description: Authenticates the user using username and password. Returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthenticationResponse'
              example:
                code: 1000
                result:
                  authenticate: true
                  token: "eyJhbGciOiJIUzUxMiJ9..."
        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Unauthenticated:
                  summary: "Error 1008: Unauthenticated"
                  value:
                    code: 1008
                    message: "Unauthenticated"

  /api/auth/resend-otp:
    post:
      tags:
        - Authentication
      summary: Resend OTP to email
      description: Resends a new 6-digit OTP to the provided email address. Rate-limited to prevent abuse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
              example:
                code: 1000
                message: "New otp has been sent to your email!"
        '400':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                AccountNotFound:
                  summary: "Error 1014: Account Not Found"
                  value:
                    code: 1014
                    message: "Account not found!"
        '429':
          description: Too many requests - resend rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                ResendTooFast:
                  summary: "Error 1016: Resend OTP Too Fast"
                  value:
                    code: 1016
                    message: "Resend Otp too fast"

  # ==========================================
  # ACCOUNT ENDPOINTS
  # ==========================================
  /api/accounts:
    get:
      tags:
        - Account
      summary: Get all accounts
      description: Retrieves a list of all registered accounts. Requires ADMIN role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of accounts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAccountResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: 1009
                message: "You do not have permission"
    post:
      tags:
        - Account
      summary: Create account directly (admin)
      description: Creates a new account directly without OTP verification. Intended for admin use.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Account successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountResponse'
        '400':
          description: Validation error or duplicate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/accounts/{accountId}:
    put:
      tags:
        - Account
      summary: Update account
      description: Updates an existing account's information by account ID. Requires ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: The UUID of the account to update
          schema:
            type: string
            example: "acc-uuid-1234-5678"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountResponse'
        '400':
          description: Account not found or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: 1014
                message: "Account not found!"

  # ==========================================
  # PERMISSION ENDPOINTS
  # ==========================================
  /api/permissions:
    post:
      tags:
        - Permission
      summary: Create a new permission
      description: Creates a new system permission to be used in RBAC. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionRequest'
      responses:
        '200':
          description: Permission successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionResponse'
              example:
                code: 1000
                result:
                  name: "UPDATE_DATA"
                  description: "Update data permission"
    get:
      tags:
        - Permission
      summary: Get all permissions
      description: Retrieves a list of all existing permissions in the system. Requires ADMIN role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of permissions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPermissionResponse'
              example:
                code: 1000
                result:
                  - name: "UPDATE_DATA"
                    description: "Update data permission"
                  - name: "CREATE_USER"
                    description: "Create user permission"

  /api/permissions/{permissionId}:
    delete:
      tags:
        - Permission
      summary: Delete a permission
      description: Removes a permission from the system using its name. Requires ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          description: The unique name of the permission (e.g. UPDATE_DATA)
          schema:
            type: string
            example: "UPDATE_DATA"
      responses:
        '200':
          description: Permission deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
              example:
                code: 1000

  # ==========================================
  # ROLE ENDPOINTS
  # ==========================================
  /api/roles:
    post:
      tags:
        - Role
      summary: Create a new role with assigned permissions
      description: Creates a new role and assigns permission names for RBAC. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Role successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleResponse'
              example:
                code: 1000
                result:
                  roleName: "ADMIN"
                  description: "Administrator Role"
                  permissions:
                    - name: "UPDATE_DATA"
                      description: "Update data permission"
    get:
      tags:
        - Role
      summary: Get all roles
      description: Retrieves all roles and their assigned permissions. Requires ADMIN role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListRoleResponse'
              example:
                code: 1000
                result:
                  - roleName: "ADMIN"
                    description: "Administrator Role"
                    permissions:
                      - name: "UPDATE_DATA"
                        description: "Update data permission"
                  - roleName: "USER"
                    description: "Default user role"
                    permissions: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- REQUEST SCHEMAS ---
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - email
        - fullName
        - phoneNumber
        - gender
        - address
        - identityCard
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 50
          example: "john_doe"
          description: "5–50 characters"
        password:
          type: string
          format: password
          minLength: 6
          example: "Password123"
          description: "Minimum 6 characters"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        fullName:
          type: string
          example: "John Doe"
        phoneNumber:
          type: string
          pattern: "^(0[3|5|7|8|9])+([0-9]{8})$"
          example: "0912345678"
          description: "Vietnamese phone format: 0[3/5/7/8/9]XXXXXXXX"
        dateOfBirth:
          type: string
          format: date
          example: "1995-10-15"
          description: "Format YYYY-MM-DD, must be at least 2 years in the past"
        gender:
          type: string
          example: "MALE"
          description: "Enum: MALE, FEMALE, OTHER"
        address:
          type: string
          example: "123 Main Street, Tech City"
        identityCard:
          type: string
          pattern: "^[0-9]{12}$"
          example: "079012345678"
          description: "Exactly 12 digits"
        role:
          type: string
          example: "USER"
          description: "Optional — if omitted, default role is assigned"

    VerifyOtpRequest:
      type: object
      required:
        - otp
        - registerRequest
      properties:
        otp:
          type: string
          example: "654321"
          description: "6-digit OTP sent to email"
        registerRequest:
          $ref: '#/components/schemas/RegisterRequest'

    AuthenticationRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "john_doe"
        password:
          type: string
          format: password
          example: "Password123"

    ResendOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "johndoe@example.com"

    AccountUpdateRequest:
      type: object
      description: "All fields are optional — only provided fields will be updated"
      properties:
        email:
          type: string
          format: email
          example: "newemail@example.com"
        password:
          type: string
          format: password
          example: "NewPassword123"
        roles:
          type: array
          items:
            type: string
          example: ["ADMIN", "USER"]
        fullName:
          type: string
          example: "John Doe Updated"
        phoneNumber:
          type: string
          pattern: "^(0[3|5|7|8|9])+([0-9]{8})$"
          example: "0987654321"
        dateOfBirth:
          type: string
          format: date
          example: "1995-10-15"
        gender:
          type: string
          example: "MALE"
        address:
          type: string
          example: "456 New Street, City"
        identityCard:
          type: string
          pattern: "^[0-9]{12}$"
          example: "079012345678"

    PermissionRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: "UPDATE_DATA"
          description: "Convention: UPPER_SNAKE_CASE"
        description:
          type: string
          example: "Update data permission"

    RoleRequest:
      type: object
      required:
        - roleName
        - description
      properties:
        roleName:
          type: string
          example: "ADMIN"
        description:
          type: string
          example: "Administrator Role"
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
          example: ["UPDATE_DATA", "CREATE_USER"]

    # --- CORE RESPONSE SCHEMAS ---
    AuthenticationResponse:
      type: object
      properties:
        authenticate:
          type: boolean
          example: true
        token:
          type: string
          example: "eyJhbGciOiJIUzUxMiJ9..."

    AccountResponse:
      type: object
      properties:
        accountId:
          type: string
          example: "acc-uuid-1234-5678"
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          example: "johndoe@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-14T15:00:00"
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleResponse'

    PermissionResponse:
      type: object
      properties:
        name:
          type: string
          example: "UPDATE_DATA"
        description:
          type: string
          example: "Update data permission"

    RoleResponse:
      type: object
      properties:
        roleName:
          type: string
          example: "ADMIN"
        description:
          type: string
          example: "Administrator Role"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionResponse'

    # --- WRAPPER RESPONSES ---
    ApiResponseString:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          type: string
          example: "OTP has been sent to your email"

    ApiResponseMessage:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          example: "New otp has been sent to your email!"

    ApiResponseAccountResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          $ref: '#/components/schemas/AccountResponse'

    ApiResponseListAccountResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'

    ApiResponseAuthenticationResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          $ref: '#/components/schemas/AuthenticationResponse'

    ApiResponsePermissionResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          $ref: '#/components/schemas/PermissionResponse'

    ApiResponseListPermissionResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'

    ApiResponseRoleResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          $ref: '#/components/schemas/RoleResponse'

    ApiResponseListRoleResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'

    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          example: 1000
        message:
          type: string
          nullable: true

    # --- ERROR RESPONSE SCHEMA ---
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1003
        message:
          type: string
          example: "Uncategorized error!"
