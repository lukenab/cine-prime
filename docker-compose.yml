services:
  # ===== FRONTEND =====
  admin-dashboard:
    build: ./client/admin-dashboard
    container_name: admin-dashboard
    ports:
      - "3000:3000"
    tty: true
    networks:
      - cinema-network

  customer-portal:
    build: ./client/customer-portal
    container_name: customer-portal
    ports:
      - "3001:3000"
    tty: true
    networks:
      - cinema-network

  # ===== MICROSERVICES DISCOVERY SERVER =====
  discovery-server:
    build: ./server/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - cinema-network

  # ===== BACKEND MICROSERVICES =====
  auth-service:
    build: ./server/auth-service
    container_name: auth-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/database
      - SPRING_DATASOURCE_USERNAME=postgres  
      - SPRING_DATASOURCE_PASSWORD=123456   
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - postgres
      - discovery-server 
    networks:
      - cinema-network

  movie-service:
    build: ./server/movie-service
    container_name: movie-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/movie_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - mysql_db
      - discovery-server 
    networks:
      - cinema-network

  booking-service:
    build: ./server/booking-service
    container_name: booking-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/database
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456    
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      # Kết nối Redis & Kafka cho Booking (Khóa ghế & Bắn event)
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - discovery-server 
      - redis
      - kafka
    networks:
      - cinema-network

  payment-service:
    build: ./server/payment-service
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/database
      - SPRING_DATASOURCE_USERNAME=postgres  
      - SPRING_DATASOURCE_PASSWORD=123456    
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/ 
      # Kết nối Kafka để bắn Event thanh toán thành công
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - discovery-server 
      - kafka
    networks:
      - cinema-network

  user-service:
    build: ./server/user-service
    container_name: user-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/database
      - SPRING_DATASOURCE_USERNAME=postgres  
      - SPRING_DATASOURCE_PASSWORD=123456  
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - postgres
      - discovery-server 
    networks:
      - cinema-network

  promotion-service:
    build: ./server/promotion-service
    container_name: promotion-service
    restart: on-failure 
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/movie_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - mysql_db
      - discovery-server 
    networks:
      - cinema-network

  notification-service:
    build: ./server/notification-service
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/ 
      # Kết nối Kafka để lắng nghe Event gửi email/SMS
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - discovery-server 
      - kafka
    networks:
      - cinema-network

  api-gateway:
    build: ./server/api-gateway
    container_name: api-gateway
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/ 
    depends_on:
      - discovery-server 
    networks:
      - cinema-network

  # ===== CACHE & MESSAGE BROKER =====
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cinema-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - cinema-network

  # ===== DATA LAYER =====
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: database
    ports:
      - "5433:5432" 
    networks:
      - cinema-network

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: movie_catalog
    ports:
      - "3307:3306" 
    networks:
      - cinema-network

networks:
  cinema-network:
    driver: bridge